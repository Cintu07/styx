apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: styxclusters.styx.io
spec:
  group: styx.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                image:
                  type: string
                  default: "styx:latest"
                port:
                  type: integer
                  default: 8080
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "100m"
                    memory:
                      type: string
                      default: "128Mi"
            status:
              type: object
              properties:
                ready:
                  type: boolean
                nodes:
                  type: integer
                phase:
                  type: string
  scope: Namespaced
  names:
    plural: styxclusters
    singular: styxcluster
    kind: StyxCluster
    shortNames:
      - styx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: styx-operator
  namespace: styx-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: styx-operator
rules:
  - apiGroups: ["styx.io"]
    resources: ["styxclusters"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: styx-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: styx-operator
subjects:
  - kind: ServiceAccount
    name: styx-operator
    namespace: styx-system
