name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Build
      run: go build -v ./...

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t styx .

    - name: Test Docker health
      run: |
        docker run -d -p 8080:8080 --name styx-test styx
        sleep 3
        curl -f http://localhost:8080/health
        docker stop styx-test
